name: Relato de problema / Bug report
description: Relate uma falha reproduzível para nos ajudar a localizar e corrigir.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Vulnerabilidades de segurança devem ser enviadas pelo [relato privado de vulnerabilidades](https://github.com/theobarros22/DESTAQUESDAHORA/security/advisories/new).
        Não envie o .env completo, chaves de API, senha de administrador, cookies nem o banco de dados de produção.
  - type: input
    id: revision
    attributes:
      label: Versão do código
      description: Rode git rev-parse --short HEAD na pasta do repositório; se não tiver certeza, informe a data do download ou da atualização. Em repositórios gerados com Use this template, o número do commit não confere com o deste repositório; informe a data de geração ou da última sincronização com ele.
      placeholder: Número do commit, ou data do download, da geração ou da sincronização
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente de execução
      description: Informe o sistema, se roda em Docker ou direto na máquina e as versões relevantes; em problemas de página, o navegador.
      placeholder: Ubuntu / macOS; Docker Compose / Node.js; se há proxy reverso; se alterou configurações relacionadas.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Por qual página, comando ou ação começar? Informe os passos mínimos que reproduzem o problema.
      placeholder: |
        1. Abrir…
        2. Executar…
        3. Aparece…
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Resultado esperado e resultado real
      placeholder: Esperado…; real…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs ou capturas de tela relacionados (opcional)
      description: Cole só os trechos relevantes, removendo chaves, senhas, cookies e dados pessoais antes de enviar; pode enviar mesmo sem logs.
