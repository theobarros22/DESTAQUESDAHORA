name: Sugestão de recurso / Feature request
description: Proponha um recurso ou melhoria com um cenário de uso claro.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Este repositório não traz a lista completa de fontes de produção nem mantém adaptadores de coleta específicos para plataformas como Weibo e Xiaohongshu; veja a [documentação de fontes](https://github.com/theobarros22/DESTAQUESDAHORA/blob/destaques-da-hora/docs/sources.md) para integrar resultados de coleta externos.
        Um recurso que só o seu site precisa pode virar módulo em `modules/` no seu próprio repositório; veja a [documentação de arquitetura](https://github.com/theobarros22/DESTAQUESDAHORA/blob/destaques-da-hora/docs/architecture.md#módulos).
  - type: textarea
    id: problem
    attributes:
      label: Cenário de uso e problema encontrado
      description: Quem precisa disso e em que situação? O que está inconveniente hoje?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você gostaria que melhorasse
      description: Descreva o comportamento ou resultado que você espera; pode incluir exemplos concretos.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: O que você já tentou (opcional)
      description: Por que a configuração, o script ou outra solução existente não atende?
